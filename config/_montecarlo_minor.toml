[monte_carlo]
environment = "Environment.toml"
seed = 42
runs = 1000
chain = ["minor_offset", "single_miss"]
error.distribution = "uniform"
error.uniform.max = 2.0

[strategy.minor_offset]
max_spiral_radius = "fov"

[strategy.single_miss]
a_spiral_radius = 50.0
b_spiral_radius = 50.0

[strategy.asymmetric_swap]
spiral_radius = 50.0
lock_duration = 1.0
