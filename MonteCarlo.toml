[monte_carlo]
simulation = "Simulation.toml"
seed = 42

[[monte_carlo.chains]]
runs = 1000
chain = ["minor_offset", "single_miss"]

[error]
distribution = "uniform"
theta_min = -20.0
theta_max = 20.0
phi_min = -20.0
phi_max = 20.0

[strategy]


[strategy.minor_offset]
max_spiral_radius = "fov"
spiral_speed = 0.4

[strategy.single_miss]
a_spiral_radius = 50.0
b_spiral_radius = 50.0
spiral_speed = 0.16

[strategy.asymmetric_swap]
spiral_radius = 50.0
lock_duration = 1.0
spiral_speed = 0.16
