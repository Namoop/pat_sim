[scenario]
name = "desmos_default"

[s1]
position = [0.0, 0.0, 0.0]
bench_theta_offset = 0.02
bench_phi_offset = 0.015

[s2]
position = [0.0, 50.0, 1000.0]
bench_theta_offset = 0.02
bench_phi_offset = 0.01

[satellite]
body_radius = 0.5
dish_fov = 0.02
bench_slew_time = 0.3
fsm_settle_time = 0.0
