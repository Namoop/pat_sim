[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite"
version = "0.1.0"
description = "Monte Carlo satellite communication establishment — SDA spiral search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
viz = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "PyQt6>=6.6",
]
gpu = [
    "numba>=0.59",
    "numba-cuda",
    "cuda-python",
    "nvidia-cuda-nvcc-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
]
dev = [
    "pytest>=8.0",
]
opt = [
    "optuna>=3.0",
]
all = [
    "satellite[viz,gpu,opt,dev]",
]

[project.scripts]
satellite = "satellite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
