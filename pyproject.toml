[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite"
version = "0.1.0"
description = "Monte Carlo satellite communication establishment — SDA spiral search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
viz = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "PyQt6>=6.6",
]
perf = [
    "numba>=0.59",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
satellite = "satellite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
